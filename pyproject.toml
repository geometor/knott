[project]
name = "geometor-knott"
dynamic = ["version"]
authors = [
  { name = "geometor", email = "github@geometor.com" },
]
description = "GEOMETOR Mathematical Catalog of Dr. Ron Knott's Golden Ratio Geometry, Phigits, Golden String Morphisms, and Fibonacci/Lucas Identities."
readme = "README.rst"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sympy",
    "geometor-model",
    "rich",
]

[project.scripts]
knott = "geometor.knott.__main__:main"

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor"]
namespaces = true

[tool.setuptools.dynamic]
version = { attr = "geometor.knott.__version__" }

[project.urls]
"Website" = "https://geometor.github.io/knott"
"Repository" = "https://github.com/geometor/knott"
"Issues" = "https://github.com/geometor/knott/issues"

[tool.pytest.ini_options]
pythonpath = ["src", "../model/src"]
testpaths = ["tests"]

[tool.ruff]
lint.select = ["ANN", "D"]
lint.ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"
